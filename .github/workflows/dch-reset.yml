name: DCH demo reset
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RESET to delete every file in the demo volume and clear the DCH sheet
        required: true
        type: string
# Same group as the update workflow, so a reset never overlaps an update.
concurrency:
  group: dch-excel
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  reset:
    if: inputs.confirm == 'RESET'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the shared repo
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dch-cli/requirements.txt
      - name: Install dependencies
        run: pip install -r dch-cli/requirements.txt
      - name: Empty the volume and reset the sheet
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DCH_VOLUME_PATH: ${{ vars.DCH_VOLUME_PATH }}
        run: python dch-cli/reset_demo.py --path "$DCH_VOLUME_PATH" --workbook dch/dch_registry.xlsx
      - name: Commit the blank sheet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dch/dch_registry.xlsx
          git commit -m "Reset DCH sheet from run ${{ github.run_id }}"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
